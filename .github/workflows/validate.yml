name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - run: node scripts/validate-i18n.mjs
      - run: node scripts/build-i18n.mjs
      - run: git diff --exit-code
      - run: node scripts/validate-site.mjs
