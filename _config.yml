# The HTML is generated by scripts/build-i18n.mjs. Jekyll only filters the
# branch-based Pages deployment; public Markdown downloads stay unprocessed.
optional_front_matter:
  enabled: false

exclude:
  - AGENTS.md
  - agents.md
  - README.md
  - Docs
  - docs
  - i18n
  - templates
  - scripts
  - Workers
  - .github
  - .agents
  - .codex
  - .codex-remote-attachments
  - .idea
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
